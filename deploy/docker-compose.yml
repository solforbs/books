# Production stack for books.solforbs.com on the shared VPS (4 CPU / 6 GB RAM).
# The VPS already runs other software, so this stack exposes ONE port on localhost only
# (127.0.0.1:8088). The VPS's existing web server forwards books.solforbs.com to it
# and handles HTTPS. PostgreSQL is never reachable from outside the Docker network.
#
# Usage (on the VPS, from the repo root):
#   cp deploy/.env.example deploy/.env   # then fill in secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build

name: books

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Superuser: administration and backups only, never used by the API.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: books
      # Read once by postgres/initdb/10-books-roles.sh on the very first start.
      BOOKS_OWNER_PASSWORD: ${BOOKS_OWNER_PASSWORD:?set in deploy/.env}
      BOOKS_APP_PASSWORD: ${BOOKS_APP_PASSWORD:?set in deploy/.env}
    # Sized for the 1 GB limit below.
    command:
      [
        "postgres",
        "-c",
        "shared_buffers=256MB",
        "-c",
        "effective_cache_size=640MB",
        "-c",
        "work_mem=8MB",
        "-c",
        "maintenance_work_mem=64MB",
        "-c",
        "max_connections=60",
      ]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: during first-time setup the server listens on its socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d books"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    # Only the API can reach the database; the web container cannot.
    networks: [data]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Requests run as the restricted books_app role (row-level security applies);
      # migrations run at startup as the table owner, books_owner.
      DATABASE_URL: postgres://books_app:${BOOKS_APP_PASSWORD:?set in deploy/.env}@postgres:5432/books
      DATABASE_MIGRATION_URL: postgres://books_owner:${BOOKS_OWNER_PASSWORD:?set in deploy/.env}@postgres:5432/books
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in deploy/.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in deploy/.env}
      COOKIE_SECURE: "true"
      WEB_ORIGIN: https://books.solforbs.com
      # Exactly one trusted proxy hop (the web container's nginx) sits in front of the API.
      TRUST_PROXY: "1"
    deploy:
      resources:
        limits:
          memory: 600m
    networks: [edge, data]

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:8088:80"
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [edge]

volumes:
  postgres-data:

networks:
  edge:
  data:
    internal: true
