# Serves the single-page app and forwards API calls to the api container.
#
# Request path in production:
#   visitor -> VPS web server (HTTPS, adds the visitor IP to X-Forwarded-For)
#           -> this nginx (127.0.0.1:8088 via Docker) -> api
# We trust X-Forwarded-For only from private Docker/host addresses and take the
# right-most untrusted address as the real visitor IP, so a visitor cannot fake
# their IP by sending their own X-Forwarded-For header. The API then sees exactly
# one trusted hop (this nginx) and runs with TRUST_PROXY=1.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # Replace (not append) so the API only ever sees the verified visitor IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    # TLS always ends at the VPS web server in front of us.
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 15m;
  }

  # The service worker and manifest must never be cached long, so updates reach shops.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
